name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first; there is nothing to learn
# from a run against superseded code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The `engines.node` floor, so CI fails on the oldest supported
          # version rather than only on whatever the maintainer happens to run.
          # Derived from the dev toolchain: vitest needs ^20 || ^22 || >=24.
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit, component and integration tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # The only test that exercises the published artifacts rather than the
      # source. It has caught a `sideEffects` setting that let bundlers delete
      # the whole library, and two copies of Lit reaching one page.
      - name: Package smoke test
        run: npm run test:package

  examples:
    name: Examples render
    runs-on: ubuntu-latest

    # Not a screenshot job. `examples.spec.ts` loads all 37 example pages in a
    # real browser and fails on NaN geometry, a chart that draws nothing, or
    # unexpected console output; `example-code.spec.ts` checks each `<pre><code>`
    # block still agrees with the chart beside it. Both assert on the DOM rather
    # than on pixels, so they are platform-independent and belong here — and
    # both have caught real defects.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Example pages
        run: npm run test:examples

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/visual/report/
          retention-days: 7

# Screenshot comparison (`charts.spec.ts`, 30 tests) is deliberately absent.
#
# The baselines are named `-chromium-win32.png` and were generated on Windows.
# Playwright looks for a platform-specific filename, so a Linux runner would not
# find them; and font rasterisation differs enough between machines that a
# Windows runner would not match them either. Committing a second Linux set is
# possible but doubles the regeneration burden on every deliberate render change.
#
# They are not therefore optional. `npm run test:visual` is wired into
# `prepublishOnly`, so a release cannot go out without them passing — which is
# the moment they matter most. Run them locally after any rendering change.
